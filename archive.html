<style>
  :root{--paper:#fff;--ink:#121212;--graphite:#6b6b66;--line:#e6e4de;--tally:#e5352b;

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  @supports (overflow-x:clip){html{overflow-x:clip}}
  img{max-width:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
  .nav{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(244,243,239,.72),rgba(235,233,227,.62));backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border-bottom:1px solid rgba(214,211,202,.8)}
  .nav .in{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 clamp(16px,2.6vw,40px)}
  .logo{font-family:var(--mono);font-size:12px;letter-spacing:.16em;display:flex;align-items:center;gap:10px;white-space:nowrap}
  @media (max-width:640px){.back .long{display:none}}
  @media (max-width:420px){.logo{font-size:11px;letter-spacing:.1em;gap:8px}}
  .logo svg{width:15px;height:15px}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
  .back:hover{color:var(--ink)}
  /* dark mode */
  html.theming, html.theming *, html.theming *::before, html.theming *::after{transition:background-color .55s ease, color .55s ease, border-color .55s ease, box-shadow .55s ease, fill .55s ease, stroke .55s ease !important}
  html[data-theme="dark"]{--paper:#1a1a1c;--ink:#f2f0ea;--graphite:#a6a29a;--line:#303034;color-scheme:dark}
  html[data-theme="dark"] body{background:var(--paper);color:var(--ink)}
  html[data-theme="dark"] .nav{background:linear-gradient(180deg,rgba(34,34,37,.8),rgba(28,28,31,.72));border-bottom-color:rgba(60,60,66,.8);box-shadow:none}
  html[data-theme="dark"] .menu{background:#222225;border-color:#36363b}
  html[data-theme="dark"] .menu a:hover{background:#2b2b2f}
  html[data-theme="dark"] .burger:hover{background:rgba(255,255,255,.06)}
  html[data-theme="dark"] .burger span,html[data-theme="dark"] .burger span::before,html[data-theme="dark"] .burger span::after{background:var(--ink)}
  html[data-theme="dark"] .burger[aria-expanded="true"] span{background:transparent}
  html[data-theme="dark"] .theme{border-color:#2c2c31}
  .theme{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink);margin-right:2px}
  .theme:hover{background:rgba(0,0,0,.05)}
  html[data-theme="dark"] .theme:hover{background:rgba(255,255,255,.06)}
  .theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .theme .sun{display:block}.theme .moon{display:none}
  html[data-theme="dark"] .theme .sun{display:none}html[data-theme="dark"] .theme .moon{display:block}
  .nav .right{display:flex;align-items:center;gap:4px}
  @media (min-width:1800px){.logo{font-size:13.5px}.theme,.burger{width:44px;height:44px}.theme svg{width:20px;height:20px}}
  html[data-theme="dark"] .filters button{background:#222225}
  html[data-theme="dark"] .filters button.on{background:var(--ink);color:#0f0f10;border-color:var(--ink)}
  html[data-theme="dark"] .card .media{background:#000}
  main{padding:72px var(--pad) 120px}
  @media (max-width:640px){main{padding:44px var(--pad) 80px}.filters{margin-bottom:28px}.filters button{font-size:12px;padding:8px 13px}}
  h1{margin:0 0 14px;font-weight:800;font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.03em}
  .lede{max-width:62ch;margin:0 0 36px;font-size:15px;color:var(--graphite)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:40px}
  .filters button{font-family:var(--sans);font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--graphite);transition:background .2s,color .2s,border-color .2s}
  .filters button:hover{border-color:var(--ink);color:var(--ink)}
  .filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 32px}
  @media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:600px){.grid{grid-template-columns:1fr;gap:36px}}
  .card{display:flex;flex-direction:column;gap:14px}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap}
  .card .tags span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
  .card .media{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111;cursor:pointer;isolation:isolate}
  .card .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
  .card .media:hover img{transform:scale(1.04)}
  .card .media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .card .media .play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#000;font-size:16px;opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .card .media:hover .play{opacity:1;transform:none}
  .card .media.playing .play{display:none}
  .card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .card p{margin:4px 0 0;color:var(--graphite);font-size:14px}
  .card .role{margin-top:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
  .card .more{margin-top:10px;display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:13px;border-bottom:1px solid var(--ink);padding-bottom:2px;width:max-content}
  .card .more:hover{color:var(--graphite);border-color:var(--graphite)}
  .count{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);margin:-24px 0 28px}
</style>

const thumb = f => f.yt ? (THUMBS[f.yt] || "https://img.youtube.com/vi/"+f.yt+"/hqdefault.jpg") : f.og;
function render(filter="All"){
  const rows = FILMS.filter(f => filter==="All" || f.tags.includes(filter));
  $("#grid").innerHTML = rows.map((f,i)=>`
    <article class="card" data-i="${FILMS.indexOf(f)}">
      <div class="tags">${f.tags.map(t=>`<span>${t}</span>`).join("")}</div>
      <div class="media" ${f.yt?`data-yt="${f.yt}"`:""} role="button" tabindex="0" aria-label="Play ${f.client} — ${f.title}">
        <img src="${thumb(f)}" alt="" loading="lazy"><span class="play">▶</span>
      </div>
      <div><h3>${f.client}</h3><p>${f.title}</p>${f.role?`<div class="role">${f.role}</div>`:""}
      <a class="more" href="/film#${f.slug}">View details →</a></div>
    </article>`).join("");
  $("#count").textContent = rows.length + " films";
}
render();
$("#filters").addEventListener("click", e=>{ const b=e.target.closest("[data-f]"); if(!b) return; document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b)); render(b.dataset.f); });
function play(m){
  if (!m.dataset.yt || m.classList.contains("playing")) return;
  document.querySelectorAll(".media.playing").forEach(x=>{ x.classList.remove("playing"); x.querySelector("iframe")?.remove(); });
  const f=document.createElement("iframe"); f.src="https://www.youtube-nocookie.com/embed/"+m.dataset.yt+"?autoplay=1&rel=0&modestbranding=1"; f.allow="autoplay; fullscreen; picture-in-picture"; f.allowFullscreen=true; f.title="Film";
  m.appendChild(f); m.classList.add("playing");
}
document.addEventListener("click", e=>{ const m=e.target.closest(".media"); if(m) play(m); });
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("media")){ e.preventDefault(); play(e.target); } });
</script>
