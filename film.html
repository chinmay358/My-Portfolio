<style>
  :root{--paper:#fff;--ink:#121212;--graphite:#6b6b66;--line:#e6e4de;--tally:#e5352b;
    --display:"Instrument Serif",Georgia,serif;--sans:"Manrope","Helvetica Neue",Arial,sans-serif;--mono:"Share Tech Mono","SFMono-Regular",Menlo,monospace;--pad:clamp(28px,5vw,88px)}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  @supports (overflow-x:clip){html{overflow-x:clip}}
  img{max-width:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
  .nav{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(244,243,239,.72),rgba(235,233,227,.62));backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border-bottom:1px solid rgba(214,211,202,.8)}
  .nav .in{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 clamp(16px,2.6vw,40px)}
  .logo{font-family:var(--mono);font-size:12px;letter-spacing:.16em;display:flex;align-items:center;gap:10px;white-space:nowrap}
  @media (max-width:420px){.logo{font-size:11px;letter-spacing:.1em;gap:8px}}
  .logo svg{width:15px;height:15px}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
  .back:hover{color:var(--ink)}
  /* dark mode */
  html.theming, html.theming *, html.theming *::before, html.theming *::after{transition:background-color .55s ease, color .55s ease, border-color .55s ease, box-shadow .55s ease, fill .55s ease, stroke .55s ease !important}
  html[data-theme="dark"]{--paper:#1a1a1c;--ink:#f2f0ea;--graphite:#a6a29a;--line:#303034;color-scheme:dark}
  html[data-theme="dark"] body{background:var(--paper);color:var(--ink)}
  html[data-theme="dark"] .nav{background:linear-gradient(180deg,rgba(34,34,37,.8),rgba(28,28,31,.72));border-bottom-color:rgba(60,60,66,.8);box-shadow:none}
  html[data-theme="dark"] .menu{background:#222225;border-color:#36363b}
  html[data-theme="dark"] .menu a:hover{background:#2b2b2f}
  html[data-theme="dark"] .burger:hover{background:rgba(255,255,255,.06)}
  html[data-theme="dark"] .burger span,html[data-theme="dark"] .burger span::before,html[data-theme="dark"] .burger span::after{background:var(--ink)}
  html[data-theme="dark"] .burger[aria-expanded="true"] span{background:transparent}
  html[data-theme="dark"] .theme{border-color:#2c2c31}
  .theme{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;color:var(--ink);margin-right:2px}
  .theme:hover{background:rgba(0,0,0,.05)}
  html[data-theme="dark"] .theme:hover{background:rgba(255,255,255,.06)}
  .theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .theme .sun{display:block}.theme .moon{display:none}
  html[data-theme="dark"] .theme .sun{display:none}html[data-theme="dark"] .theme .moon{display:block}
  .nav .right{display:flex;align-items:center;gap:4px}
  @media (min-width:1800px){.logo{font-size:13.5px}.theme,.burger{width:44px;height:44px}.theme svg{width:20px;height:20px}}
  html[data-theme="dark"] .player{background:#000}
  html[data-theme="dark"] .foot a:hover,html[data-theme="dark"] .back:hover{color:var(--ink)}
  main{padding:64px var(--pad) 120px;max-width:1400px;margin:0 auto}
  @media (max-width:640px){main{padding:40px var(--pad) 80px}.player{margin:32px 0 40px;border-radius:12px}.foot{flex-wrap:wrap;margin-top:56px}}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--graphite);margin:0 0 18px}
  h1{margin:0;font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(48px,7vw,120px);line-height:.95;letter-spacing:-.02em}
  h1 small{display:block;font-family:var(--sans);font-style:normal;font-weight:600;font-size:clamp(16px,1.4vw,22px);letter-spacing:-.005em;color:var(--graphite);margin-top:18px}
  .player{position:relative;aspect-ratio:16/9;background:#0b0d0b;border-radius:18px;overflow:hidden;margin:48px 0 56px;isolation:isolate}
  .player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .player .go{position:absolute;inset:0;display:grid;place-items:center;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
  .player .go span{display:inline-flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:rgba(255,255,255,.92);color:#000;border-radius:999px;padding:14px 22px;transition:transform .3s}
  .player .go:hover span{transform:scale(1.04)}
  .player.playing .go{display:none}
  .grid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:48px clamp(40px,6vw,96px)}
  @media (max-width:800px){.grid{grid-template-columns:1fr}}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 20px;font-size:14px;align-content:start}
  dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);padding-top:4px}
  dd{margin:0;font-weight:500}
  dd a{border-bottom:1px solid var(--line)}
  dd a:hover{border-color:var(--ink)}
  .body p{margin:0 0 18px;max-width:66ch;font-size:clamp(15px,1.15vw,18px);line-height:1.8}
  h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--graphite);margin:56px 0 18px;font-weight:400}
  ul.care{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 32px}
  ul.care li{border-top:1px solid var(--line);padding:12px 0;font-weight:500}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:80px;padding-top:28px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite)}
  .foot a:hover{color:var(--ink)}
</style>
</head>

<script>
/* ---------- theme ---------- */
(function(){
  const root=document.documentElement, key="chinmay-theme";
  let saved=null; try{ saved=localStorage.getItem(key); }catch(e){}
  const prefers = matchMedia("(prefers-color-scheme: dark)").matches;
  const apply = t => { if(t==="dark") root.setAttribute("data-theme","dark"); else root.removeAttribute("data-theme"); };
  apply(saved || (prefers ? "dark" : "light"));
  const b=document.getElementById("theme");
  let tm=null;
  if(b) b.addEventListener("click",()=>{ const t=root.getAttribute("data-theme")==="dark"?"light":"dark"; root.classList.add("theming"); apply(t); try{ localStorage.setItem(key,t); }catch(e){} clearTimeout(tm); tm=setTimeout(()=>root.classList.remove("theming"),650); });
})();

oncept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "CRO04DRwJEQ", "poster": "https://img.youtube.com/vi/CRO04DRwJEQ/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-dbs-sales-zoho-crm"}, {"id": "zoho-ryb-customer-service-zoho-desk", "n": 3, "client": "Zoho Desk", "title": "Run your Customer Service On Zoho", "format": "Live-action Video Ad", "year": "2026", "role": "", "desc": "Zoho approached us to build a multi-product campaign that feels human, not salesy. This film is one of the 6 ads in the Run Your Business on Zoho campaign. The philosophy was to capture everyday office interactions where real recommendations happen, like word of mouth you’d trust. The slice-of-life here is a support floor that’s unusually calm, because the chaos is finally organized: tickets from everywhere in one place, routine replies handled fast, and urgent issues routed correctly. The product reveal doesn’t “sell,” it simply explains why the team looks alive again.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "oYf37cZhQAs", "poster": "https://img.youtube.com/vi/oYf37cZhQAs/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-ryb-customer-service-zoho-desk"}, {"id": "zoho-ryb-projects-zoho-projects", "n": 4, "client": "Zoho Projects", "title": "Run Your Projects on Zoho", "format": "Live-action Video Ad", "year": "2026", "role": "", "desc": "Zoho approached us to create a campaign system for multiple products, designed for performance across platforms. This film is one of the 6 ads in the Run Your Business on Zoho campaign. The philosophy stayed consistent: take a slice of real work life and let Zoho show up through a natural, colleague-to-colleague recommendation. The moment here is instantly recognizable for project teams: workload overload, constant moving parts, and the need to spot delays before they become bottlenecks. The story makes the tool feel like a quiet superpower you adopt, then wonder how you managed without.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "YOJq5WVYOPA", "poster": "https://img.youtube.com/vi/YOJq5WVYOPA/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-ryb-projects-zoho-projects"}, {"id": "zoho-dbs-projects-zoho-projects", "n": 5, "client": "Zoho Projects", "title": "Move Your Projects Forward With Zoho", "format": "Live-Action Explainer Video", "year": "2026", "role": "", "desc": "Part of Zoho - Desh Ka Business Software, a 6-film explainer campaign engineered so each cutdown works as a separate performance collateral across LinkedIn, X, and YouTube. This film is built as three mini-stories: three businesses, three project bottlenecks, one consistent solution. It shows how projects stall for different reasons, unclear ownership, shifting timelines, scattered updates, dependency delays, then lands Zoho Projects as the system to plan, track, and deliver with visibility. The modular structure makes targeting easy: one master film, plus three context-specific edits that still feel like one campaign.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "PsdXWER9TD4", "poster": "https://img.youtube.com/vi/PsdXWER9TD4/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-dbs-projects-zoho-projects"}, {"id": "zoho-dbs-accounting-zoho-books", "n": 6, "client": "Zoho Books", "title": "Move Your Accounting Forward With Zoho", "format": "Live-Action Explainer Video", "year": "2026", "role": "", "desc": "A film under Zoho – Desh Ka Business Software, created as a complete explainer with cutdowns designed to function as performance marketing collaterals across LinkedIn, X, and YouTube. Accounting stress is universal, but it looks different by business type, so the film moves across three worlds (pharmacy, CA office, event management) to show invoices, payments, reconciliation, compliance, and deadline pressure. Zoho Books is positioned as the accounting and GST-ready finance system that brings order and visibility to day-to-day finances. One story, three business-specific cutdowns, built for sharper targeting.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "bFIYVZE4RAM", "poster": "https://img.youtube.com/vi/bFIYVZE4RAM/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-dbs-accounting-zoho-books"}, {"id": "zoho-ryb-marketing-zoho-marketing-plus", "n": 7, "client": "Zoho Marketing Plus", "title": "Run Your Marketing on Zoho", "format": "Live-action Video Ad", "year": "2026", "role": "", "desc": "Zoho approached us to create a campaign framework for multiple product films that could run as ads and still feel real. This film is one of the 6 ads in the Run Your Business on Zoho campaign. The philosophy was to capture word of mouth on camera: show a believable work moment, then let the product arrive through a calm, non-salesy recommendation. The slice-of-life here is marketing chaos at its most relatable, a pricing mistake spread across landing pages, schedules, posts, and assets. The story sells the relief of fixing everything fast, from one place, even when you’re not at your desk.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "0grieFFWVGQ", "poster": "https://img.youtube.com/vi/0grieFFWVGQ/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-ryb-marketing-zoho-marketing-plus"}, {"id": "zoho-ryb-workplace-zoho-workplace", "n": 8, "client": "Zoho Workplace", "title": "Run Your Workplace on Zoho", "format": "Live-action Video Ad", "year": "2026", "role": "", "desc": "Zoho approached us to design a cross-product campaign that decision-makers would actually watch. This film is one of the 6 ads in the Run Your Business on Zoho campaign. The philosophy was to make software feel like word of mouth: a real colleague showing you a real shortcut in a real moment. The slice-of-life here is returning to work after time off and facing the classic mess, unread email threads, missed chats, lost meeting links, scattered files, and insecure passwords. The calm comes from everything living together, so “catching up” doesn’t feel like starting over.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "rHosijKUnnM", "poster": "https://img.youtube.com/vi/rHosijKUnnM/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-ryb-workplace-zoho-workplace"}, {"id": "zoho-dbs-teamwork-zoho-workplace", "n": 9, "client": "Zoho Workplace", "title": "Move Your Teamwork Forward With Zoho", "format": "Live-Action Explainer Video", "year": "2026", "role": "", "desc": "A film from Zoho – Desh Ka Business Software, designed as a full explainer while ensuring cutdowns can run as performance marketing collaterals on LinkedIn, X, and YouTube. The setup is a startup reality: work scattered across too many tools creates chaos, not speed. Email, files, chat, meetings, and feedback living in different places slows collaboration and decision-making. The film positions Zoho Workplace as the connected productivity suite that brings communication and collaboration into one place. The result is a clean, quick value story that translates neatly into short, targeted edits.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "X7D-X1eqTlc", "poster": "https://img.youtube.com/vi/X7D-X1eqTlc/maxresdefault.jpg", "studio": "https://www.bombaylocale.com/work/zoho-dbs-teamwork-zoho-workplace"}, {"id": "zoho-ryb-finance-zoho-finance", "n": 10, "client": "Zoho Finance", "title": "Run your Finance on Zoho", "format": "Live-action Video Ad", "year": "2026", "role": "", "desc": "Zoho approached us to build a campaign that could scale across products without sounding like advertising. This film is one of the 6 ads in the Run Your Business on Zoho campaign. The philosophy was slice-of-life, word-of-mouth storytelling: show the everyday finance “jungle,” then let Zoho enter as the tool your team already trusts. The moment here is a fast-moving launch day where finance touches everything, invoicing, taxes, order queries, inventory pressure, and payment confirmations. Instead of heroics, the story sells a feeling: control, clarity, and fewer spreadsheet fires, delivered through casual confidence.", "care": ["Market Research & Customer Journey", "Positioning, Concept and Screenplay", "Casting, Direction & Pre Production", "Set Design, Art Direction and Production", "Post Production, VFX, GenAI Workflows", "Sound Design and Music Composition"], "yt": "TMNwLdzQ89I", "poster": "https://img.youtube const THUMBS = {};
const $ = s => document.querySelector(s);
function render(){
  const id = (location.hash||"").replace("#","") || FILMS[0].id;
  const f = FILMS.find(x=>x.id===id) || FILMS[0];
  const i = FILMS.indexOf(f), prev = FILMS[(i-1+FILMS.length)%FILMS.length], next = FILMS[(i+1)%FILMS.length];
  document.title = f.client+" — "+f.title;
  const poster = THUMBS[f.poster] || f.poster;
  $("#main").innerHTML = `
    <p class="eyebrow">(${String(f.n).padStart(2,"0")}) · ${f.format} · ${f.year}</p>
    <h1>${f.title}<small>${f.client}</small></h1>
    <div class="player" id="player"><img src="${poster}" alt="">${f.yt?`<div class="go" role="button" tabindex="0" aria-label="Play the film"><span>▶ Play the film</span></div>`:""}</div>
    <div class="grid">
      <dl>
        <dt>Client</dt><dd>${f.client}</dd>
        <dt>Format</dt><dd>${f.format}</dd>
        <dt>Year</dt><dd>${f.year}</dd>
        ${f.role?`<dt>My role</dt><dd>${f.role}</dd>`:""}
        <dt>Studio</dt><dd>Bombay Locale</dd>
        <dt>Links</dt><dd>${f.yt?`<a href="https://www.youtube.com/watch?v=${f.yt}" target="_blank" rel="noopener">YouTube ↗</a><br>`:""}<a href="${f.studio}" target="_blank" rel="noopener">Studio page ↗</a></dd>
      </dl>
      <div class="body">
        ${f.desc.split(/(?<=[.!?])\s+(?=[A-Z“"])/).reduce((acc,s)=>{const last=acc[acc.length-1]; if(last && (last+" "+s).length<420) acc[acc.length-1]=last+" "+s; else acc.push(s); return acc;},[]).map(p=>`<p>${p}</p>`).join("")}
        <h2>What went into it</h2>
        <ul class="care">${f.care.map(c=>`<li>${c}</li>`).join("")}</ul>
      </div>
    </div>
    <div class="foot"><a href="#${prev.id}">← ${prev.client}</a><a href="/archive" id="back2">All films</a><a href="#${next.id}">${next.client} →</a></div>`;
  const player=$("#player"), go=player.querySelector(".go"); if(!go) return;
  const play=()=>{ if(player.classList.contains("playing")) return; const fr=document.createElement("iframe"); fr.src="https://www.youtube-nocookie.com/embed/"+f.yt+"?autoplay=1&rel=0&modestbranding=1"; fr.allow="autoplay; fullscreen; picture-in-picture"; fr.allowFullscreen=true; fr.title=f.client+" — "+f.title; player.appendChild(fr); player.classList.add("playing"); };
  go.addEventListener("click",play); go.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); play(); } });
  window.scrollTo(0,0);
}
render(); addEventListener("hashchange", render);
</script>
